<?xml version="1.0" encoding="UTF-8"?>
<!-- Padded code icon: 140x140 canvas with a ~60x60 glyph centered -->
<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140" fill="none">
  <!-- Transparent background provides padding; do not add any fill here -->
  <g transform="translate(70,70)">
    <!-- left chevron < -->
    <path d="M -22 -18 L -40 0 L -22 18" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- right chevron > -->
    <path d="M 22 -18 L 40 0 L 22 18" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- slash / -->
    <path d="M -6 24 L 6 -24" stroke="white" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>

